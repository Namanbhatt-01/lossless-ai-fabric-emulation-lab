name: Lab 01 - Lossless AI Fabric Emulation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  run-emulation:
    name: Run Containerized Spine-Leaf Emulation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Lab 01 Container
        run: |
          docker build -t lossless-fabric-lab:latest .

      - name: Execute Emulation & Telemetry Verification
        run: |
          docker run --rm --privileged -v ${{ github.workspace }}/artifacts:/lab/artifacts lossless-fabric-lab:latest

      - name: Archive Experiment Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-emulation-artifacts
          path: artifacts/
