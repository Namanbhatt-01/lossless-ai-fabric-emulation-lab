# Telegraf Sub-Second Push Telemetry Agent for Queue Depth & Interface Drops

[agent]
  interval = "1s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "1s"
  flush_jitter = "0s"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "telemetry_secret_token_12345"
  organization = "ai_fabric"
  bucket = "queue_telemetry"

[[inputs.net]]
  interfaces = ["eth*", "l1*", "l2*", "s1*", "s2*"]

[[inputs.netstat]]

[[inputs.system]]

[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = false
