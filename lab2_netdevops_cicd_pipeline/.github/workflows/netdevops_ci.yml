name: NetDevOps Automated Network Validation CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-network-topology:
    name: Containerized Pre/Post Change Assertion Testbed
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install NetDevOps Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r lab2_netdevops_cicd_pipeline/requirements.txt

      - name: Deploy Lightweight Network Container Testbed
        run: |
          docker compose -f lab2_netdevops_cicd_pipeline/topology/docker-compose.yml up -d
          sleep 5

      - name: Extract Pre-Change Network State Snapshot
        run: |
          python lab2_netdevops_cicd_pipeline/automation/snapshot_engine.py --phase pre

      - name: Execute Automated Pytest Network Validation Assertions
        run: |
          pytest lab2_netdevops_cicd_pipeline/tests/ -v --html=report.html --self-contained-html

      - name: Extract Post-Change State Snapshot & Verify Zero Drift
        run: |
          python lab2_netdevops_cicd_pipeline/automation/snapshot_engine.py --phase post
          python lab2_netdevops_cicd_pipeline/automation/drift_remediator.py --check-only

      - name: Archive Test Results and HTML Report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: netdevops-validation-report
          path: report.html

      - name: Teardown Virtual Network Testbed
        if: always()
        run: |
          docker compose -f lab2_netdevops_cicd_pipeline/topology/docker-compose.yml down -v
