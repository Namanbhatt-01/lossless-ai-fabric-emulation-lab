version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 350M

  rag_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_secure_api
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 300M
