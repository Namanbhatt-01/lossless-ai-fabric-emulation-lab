version: '3.8'

services:
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: siem_opensearch
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx1024m"
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1200M

  wazuh_manager:
    image: wazuh/wazuh-manager:4.7.2
    container_name: siem_wazuh_manager
    environment:
      - INDEXER_URL=http://opensearch:9200
    depends_on:
      - opensearch
    ports:
      - "1514:1514/udp"
      - "55000:55000"
    volumes:
      - ./rules/rogue_llm_exfiltration.xml:/var/ossec/etc/rules/local_rules.xml:ro
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 600M

  suricata:
    image: jasonish/suricata:latest
    container_name: siem_suricata
    network_mode: host
    volumes:
      - ./rules/prompt_injection_suricata.rules:/var/lib/suricata/rules/suricata.rules:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
