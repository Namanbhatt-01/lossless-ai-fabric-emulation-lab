frr version 8.5
frr defaults traditional
hostname leaf2
log syslog informational
service integrated-vtysh-config
!
router bgp 65012
 bgp router-id 10.255.0.12
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 !
 ! Underlay eBGP to Spines
 neighbor SPINE_UNDERLAY peer-group
 neighbor SPINE_UNDERLAY remote-as 65000
 neighbor 10.0.2.0 peer-group SPINE_UNDERLAY
 neighbor 10.0.2.0 description spine1
 neighbor 10.0.2.2 peer-group SPINE_UNDERLAY
 neighbor 10.0.2.2 description spine2
 !
 ! Overlay EVPN Peering
 neighbor SPINE_EVPN peer-group
 neighbor SPINE_EVPN remote-as 65000
 neighbor SPINE_EVPN update-source lo
 neighbor SPINE_EVPN ebgp-multihop 5
 neighbor 10.255.0.1 peer-group SPINE_EVPN
 neighbor 10.255.0.1 description spine1-evpn
 neighbor 10.255.0.2 peer-group SPINE_EVPN
 neighbor 10.255.0.2 description spine2-evpn
 !
 address-family ipv4 unicast
  network 10.255.0.12/32
  neighbor SPINE_UNDERLAY activate
  neighbor SPINE_UNDERLAY route-map ALLOW-ALL in
  neighbor SPINE_UNDERLAY route-map ALLOW-ALL out
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor SPINE_EVPN activate
  advertise-all-vni
 exit-address-family
!
route-map ALLOW-ALL permit 10
!
line vty
!
