modules:
  http_2xx:
    prober: http
    timeout: 3s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200, 401, 403, 404]
      method: GET
      fail_if_ssl: false

  tcp_connect:
    prober: tcp
    timeout: 2s

  icmp_ping:
    prober: icmp
    timeout: 2s
